<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok topplista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F5F7; --surface: #FFFFFF; --line: #E3E3E8; --text: #1D1D1F; --muted: #6E6E73;
    --accent: #0071E3; --accent-soft: #E8F1FC; --good: #1F8A4C; --bar: #D9E7FA;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --surface: #1C1C1F; --line: #2E2E33; --text: #F2F2F4; --muted: #9A9AA1;
            --accent: #3D9BFF; --accent-soft: #16263A; --good: #4CC27F; --bar: #1E3350; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500; padding: 6px 12px; border-radius: 7px; cursor: pointer; min-height: 34px; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  label.min { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); }
  label.min input { width: 96px; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); }
  nav.accounts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  nav.accounts button { border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; padding: 6px 12px; border-radius: 999px; cursor: pointer; min-height: 34px; }
  nav.accounts button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .kpi b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 12px; }
  section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 16px; overflow: hidden; }
  .card h2 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .card h2 small { color: var(--muted); font-weight: 400; }
  .card h2 img { width: 26px; height: 26px; border-radius: 50%; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; font-weight: 500; color: var(--muted); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.rank { color: var(--muted); width: 32px; font-variant-numeric: tabular-nums; }
  .vid { display: flex; gap: 12px; align-items: center; min-width: 260px; }
  .thumb { width: 42px; height: 56px; border-radius: 6px; background: var(--line); flex: none; object-fit: cover; }
  .vid a { color: var(--text); text-decoration: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vid a:hover { color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; }
  .er { position: relative; min-width: 92px; }
  .er i { position: absolute; inset: 6px 0 6px auto; background: var(--bar); border-radius: 4px; z-index: 0; }
  .er span { position: relative; z-index: 1; font-weight: 600; }
  .empty { padding: 20px 16px; color: var(--muted); }
  .scroll { overflow-x: auto; }
  @media (max-width: 720px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>TikTok topplista</h1>
      <p class="sub" id="status">Laddar data …</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Period">
        <button data-days="7" aria-pressed="false">7 dagar</button>
        <button data-days="30" aria-pressed="true">30 dagar</button>
      </div>
      <div class="seg" role="group" aria-label="Sortering">
        <button data-sort="er" aria-pressed="true">Engagement</button>
        <button data-sort="views" aria-pressed="false">Visningar</button>
      </div>
      <label class="min">Min. visningar <input id="minViews" type="number" min="0" step="1000" value="5000"></label>
    </div>
  </header>

  <nav class="accounts" id="accounts" aria-label="Konto"></nav>
  <div class="kpis" id="kpis"></div>
  <div id="lists"></div>
</div>

<script>
const state = { days: 30, sort: 'er', minViews: 5000, account: 'alla' };
let data = { videos: [] };

const nf = new Intl.NumberFormat('sv-SE');
const compact = new Intl.NumberFormat('sv-SE', { notation: 'compact', maximumFractionDigits: 1 });
const pct = (x) => (x * 100).toLocaleString('sv-SE', { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + ' %';
const date = (iso) => new Date(iso).toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const median = (xs) => { if (!xs.length) return 0; const s = [...xs].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

function inPeriod() {
  const cutoff = new Date(data.fetchedAt).getTime() - state.days * 864e5;
  return data.videos.filter((v) => new Date(v.posted).getTime() >= cutoff);
}

function topTen(videos) {
  return videos
    .filter((v) => v.views >= state.minViews)
    .sort((a, b) => b[state.sort] - a[state.sort])
    .slice(0, 10);
}

function table(rows) {
  if (!rows.length) return `<p class="empty">Inga videor över ${nf.format(state.minViews)} visningar under perioden.</p>`;
  const maxEr = Math.max(...rows.map((r) => r.er));
  return `<div class="scroll"><table>
    <thead><tr><th>#</th><th>Video</th><th class="n">Engagement</th><th class="n">Visningar</th>
      <th class="n hide-sm">Likes</th><th class="n hide-sm">Komm.</th><th class="n hide-sm">Delningar</th><th class="n hide-sm">Sparade</th></tr></thead>
    <tbody>${rows.map((v, i) => `<tr>
      <td class="rank">${i + 1}</td>
      <td><div class="vid">
        ${v.cover ? `<img class="thumb" src="${esc(v.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.removeAttribute('src')">` : '<span class="thumb"></span>'}
        <div><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.text || '(ingen text)')}</a>
          <div class="meta">@${esc(v.handle)} · ${date(v.posted)}${v.duration ? ` · ${v.duration} s` : ''}</div></div>
      </div></td>
      <td class="n er"><i style="width:${maxEr ? (v.er / maxEr) * 100 : 0}%"></i><span>${pct(v.er)}</span></td>
      <td class="n">${compact.format(v.views)}</td>
      <td class="n hide-sm">${compact.format(v.likes)}</td>
      <td class="n hide-sm">${compact.format(v.comments)}</td>
      <td class="n hide-sm">${compact.format(v.shares)}</td>
      <td class="n hide-sm">${compact.format(v.saves)}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function kpis(videos) {
  const eligible = videos.filter((v) => v.views >= state.minViews);
  const views = videos.reduce((s, v) => s + v.views, 0);
  document.getElementById('kpis').innerHTML = [
    [nf.format(videos.length), 'videor under perioden'],
    [compact.format(views), 'visningar totalt'],
    [pct(median(videos.map((v) => v.er))), 'median-engagement'],
    [nf.format(videos.length - eligible.length), `under ${compact.format(state.minViews)} visningar`],
  ].map(([b, s]) => `<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join('');
}

function render() {
  const videos = inPeriod();
  const handles = [...new Set(data.videos.map((v) => v.handle))];
  const scoped = state.account === 'alla' ? videos : videos.filter((v) => v.handle === state.account);

  document.getElementById('accounts').innerHTML = ['alla', ...handles].map((h) =>
    `<button data-account="${esc(h)}" aria-pressed="${state.account === h}">${h === 'alla' ? 'Alla konton' : '@' + esc(h)}</button>`).join('');

  kpis(scoped);

  const sortLabel = state.sort === 'er' ? 'engagement' : 'visningar';
  let html = '';
  if (state.account === 'alla') {
    html += `<section class="card"><h2>Topp 10 totalt <small>${state.days} dagar, sorterat på ${sortLabel}</small></h2>${table(topTen(videos))}</section>`;
  }
  for (const h of state.account === 'alla' ? handles : [state.account]) {
    const own = videos.filter((v) => v.handle === h);
    const any = data.videos.find((v) => v.handle === h);
    html += `<section class="card"><h2>
      ${any?.avatar ? `<img src="${esc(any.avatar)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
      @${esc(h)} <small>${any?.followers != null ? compact.format(any.followers) + ' följare · ' : ''}${own.length} videor · median ${pct(median(own.map((v) => v.er)))}</small>
    </h2>${table(topTen(own))}</section>`;
  }
  document.getElementById('lists').innerHTML = html;
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.days) state.days = Number(b.dataset.days);
  else if (b.dataset.sort) state.sort = b.dataset.sort;
  else if (b.dataset.account) state.account = b.dataset.account;
  else return;
  for (const g of document.querySelectorAll('.seg button')) {
    g.setAttribute('aria-pressed', String(g.dataset.days == state.days || g.dataset.sort === state.sort));
  }
  render();
});
document.getElementById('minViews').addEventListener('input', (e) => { state.minViews = Number(e.target.value) || 0; render(); });

fetch('data/videos.json', { cache: 'no-store' })
  .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
  .then((json) => {
    data = json;
    document.getElementById('status').textContent =
      `${nf.format(data.videos.length)} videor · hämtat ${new Date(data.fetchedAt).toLocaleString('sv-SE', { dateStyle: 'medium', timeStyle: 'short' })} · engagement = (likes + kommentarer + delningar) / visningar`;
    render();
  })
  .catch(() => { document.getElementById('status').textContent = 'Ingen data än. Kör npm run fetch först.'; });
</script>
</body>
</html>
