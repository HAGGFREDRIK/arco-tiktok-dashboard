name: Ändra konkurrenter

on:
  workflow_dispatch:
    inputs:
      kund:
        description: Kund
        type: choice
        required: true
        options:
          - "ACO"
          - "Elexir Pharma"
          - "Gorilla"
          - "Natural Cycles"
          - "Natural Cycles UK"
          - "Naturkompaniet"
          - "PROfeel"
          - "Skruvat"
          - "Swedish Candy"
          - "TurtleWax"
          - "VÄLA/NOVA"
          - "WD-40"
          - "Wunderbaum"
      lagg_till:
        description: Lägg till (TikTok-länkar eller @namn, separerade med komma)
        type: string
        required: false
      ta_bort:
        description: Ta bort (TikTok-länkar eller @namn, separerade med komma)
        type: string
        required: false
      hamta:
        description: Hämta ny data direkt efteråt
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uppdatera listan
        run: node scripts/competitors.mjs
        env:
          KUND: ${{ inputs.kund }}
          LAGG_TILL: ${{ inputs.lagg_till }}
          TA_BORT: ${{ inputs.ta_bort }}
      - name: Committa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add config/clients.json
          git diff --cached --quiet || git commit -m "Konkurrenter för ${{ inputs.kund }}"
          git push
      - name: Starta hämtning
        if: ${{ inputs.hamta }}
        run: gh workflow run fetch.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
