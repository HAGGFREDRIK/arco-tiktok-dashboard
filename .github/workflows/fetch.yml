name: Hämta TikTok-data

on:
  schedule:
    - cron: '17 5 * * 1' # måndagar 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run fetch
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Committa ny data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add site/data/videos.json
          git diff --cached --quiet || git commit -m "Ny TikTok-data $(date -u +%F)"
          git push
